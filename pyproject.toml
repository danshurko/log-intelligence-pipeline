[project]
name = "log-intelligence-pipeline"
version = "0.1.0"
description = "Log intelligence pipeline for simulated IoT device events"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.34",
    "click>=8.1",
    "pydantic>=2.0",
    "pyarrow>=15.0",
    "pandas>=2.0",
    "duckdb>=0.10",
    "pytest>=8.0",
    "ruff>=0.4",
    "streamlit>=1.32",
    "plotly>=5.20",
    "pyathena>=3.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
